[package]
name = "webtoon-translator"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Traduz e explica textos em inglês de webtoons e quadrinhos"

[lib]
name = "webtoon_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
webtoon-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
keyring = "2"
xcap = "0.9"
image = "0.25"
base64 = "0.22"
tauri-plugin-global-shortcut = "2.4"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
