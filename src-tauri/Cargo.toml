[package]
name = "webtoon-translator"
version = "0.1.0"
edition = "2021"

[lib]
name = "webtoon_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
keyring = "2"
xcap = "0.9"
image = "0.25"
base64 = "0.22"
sherpa-onnx = { version = "2.0.2", default-features = false, features = ["static"] }
tauri-plugin-global-shortcut = "2.4"
ocrs = "0.14"
rten = "0.28"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
