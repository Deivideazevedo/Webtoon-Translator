<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Tradução</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; padding: 0; }
  /* --bubble-alpha vem da configuração "Opacidade do balão" (bubble.js). Só o FUNDO fica
     translúcido; o texto continua opaco e ganha sombra pra não sumir em cima da arte. */
  :root { --bubble-alpha: .85; }
  .bubble-card {
    background: rgba(var(--card-rgb), var(--bubble-alpha));
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .bubble-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: rgba(var(--bg-rgb), var(--bubble-alpha));
    border-bottom: 1px solid var(--border);
    cursor: move;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }
  .bubble-body { padding: 12px; overflow-y: auto; overflow-x: hidden; flex: 1; font-size: 13px; }
  .bubble-card.translucent { text-shadow: var(--text-shadow); }

  /* Mesmo layout do cartão do Android: cabeçalho de botões redondos, 🔊/🐢 numa coluna estreita
     à esquerda do texto (frase e trechos), nota do trecho com barrinha. */
  :root { --chip: rgba(255, 255, 255, .12); --accent-soft: rgba(110, 168, 255, .25); }
  @media (prefers-color-scheme: light) {
    :root { --chip: rgba(0, 0, 0, .08); --accent-soft: rgba(42, 99, 214, .18); }
  }
  .circle {
    width: 26px; height: 26px; padding: 0; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: var(--chip); color: var(--text);
    font-size: 13px; line-height: 1; cursor: pointer;
  }
  .circle.label { font-size: 10px; font-weight: 600; }
  .circle.active { background: var(--accent-soft); color: var(--accent); }
  .circle:disabled { opacity: .35; cursor: default; }
  .head-spacer { flex: 1; align-self: stretch; }

  .block { display: flex; gap: 10px; align-items: flex-start; }
  .rail { display: flex; flex-direction: column; gap: 6px; }
  .block-text { flex: 1; min-width: 0; }

  .translation { font-size: 16px; line-height: 1.35; }
  .original { color: var(--text); opacity: .85; font-size: 13px; line-height: 1.5; margin-top: 6px; }
  .pron { color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* Um balão por linha, como no quadrinho. */
  .original, .pron { white-space: pre-line; }
  .skeleton { color: var(--muted); font-style: italic; }
  .error-line { color: var(--danger); font-size: 13px; }

  .learn { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .learn-tabs { display: flex; gap: 4px; margin: 0 0 4px; }
  .learn-tabs button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 2px 10px; font-size: 12px;
  }
  .learn-tabs button.active { color: var(--accent); border-color: var(--accent); }
  .chunk { border-top: 1px solid var(--border); padding: 8px 0; }
  .chunk:first-of-type { border-top: none; }
  .segment { font-size: 14px; }
  .meaning { font-size: 14px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
  .note {
    color: var(--muted); font-size: 12px; line-height: 1.35;
    margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border);
  }
  .note b { font-weight: 600; }
  .grammar { font-size: 13px; line-height: 1.4; }

  .model-chip {
    display: inline-block; margin-top: 8px; padding: 1px 10px;
    border-radius: 8px; background: var(--chip); color: var(--muted); font-size: 11px;
  }

  /* Hover com a tradução literal: aparece ACIMA da palavra pra o cursor não cobrir. */
  .w { position: relative; cursor: help; border-bottom: 1px dotted var(--border); }
  .w:hover { border-bottom-color: var(--accent); color: var(--text); opacity: 1; }
  .w:hover::after {
    content: attr(data-gloss);
    position: absolute;
    left: 0;
    bottom: calc(100% + 4px);
    z-index: 10;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-style: normal;
    font-weight: normal;
    text-shadow: none;
    white-space: nowrap;
    pointer-events: none;
  }
  .w.th:hover::after { white-space: normal; width: 220px; }
</style>
</head>
<body>
  <div class="bubble-card">
    <div class="bubble-head" data-tauri-drag-region>
      <button id="copy_btn" class="circle" type="button" title="Copiar original + tradução" disabled>📋</button>
      <button id="fav_btn" class="circle" type="button" title="Favoritar" disabled>☆</button>
      <button id="ipa_btn" class="circle label" type="button" title="Alternar PT-BR / IPA" hidden>IPA</button>
      <button id="learn_btn" class="circle" type="button" title="Aprender (trechos e gramática)" disabled>📖</button>
      <span class="head-spacer" data-tauri-drag-region></span>
      <button id="close_btn" class="circle" type="button" title="Fechar (Esc)">✕</button>
    </div>
    <div class="bubble-body" id="content">Carregando...</div>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
