# APK do Android, assinado, anexado ao rascunho de Release da mesma tag (criado pelo release.yml).
# Dispara junto com a tag de versão; dá pra rodar de novo à mão (Actions → Android APK → Run workflow).
# A assinatura vem dos secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD: sempre a mesma chave, senão o Android não instala a atualização por cima.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release onde anexar o APK (ex.: v0.2.0)"
        required: true
      ref:
        description: "Código a compilar (tag ou branch); vazio = a própria tag"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # A máquina já tem o Android SDK; só aceita as licenças e instala o NDK que a ponte Rust usa.
      - name: Android SDK e NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "build-tools;36.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: android/rust-bridge

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --version "^4" --locked

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gerar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Espera o rascunho da tag existir (o desktop é que cria) e anexa o APK, trocando um anterior.
      - name: Anexar ao release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            let release;
            for (let i = 0; i < 60 && !release; i++) {
              const all = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
              release = all.find((r) => r.tag_name === tag);
              if (!release) await new Promise((r) => setTimeout(r, 60_000));
            }
            if (!release) throw new Error(`Release da tag ${tag} não encontrado.`);
            const name = `WebtoonTranslator-${tag}.apk`;
            for (const asset of release.assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            const data = fs.readFileSync('android/app/build/outputs/apk/release/app-release.apk');
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name, data,
              headers: { 'content-type': 'application/vnd.android.package-archive', 'content-length': data.length },
            });
