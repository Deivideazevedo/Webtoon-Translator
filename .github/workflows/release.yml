# Gera os instaladores (Linux: AppImage/deb/rpm, Windows: exe/msi) e o APK do Android, e cria um
# rascunho de Release com todos. Dispara ao enviar uma tag de versão:  git tag v0.2.0 && git push origin v0.2.0
# O APK é assinado com a chave dos secrets ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD (sempre a mesma chave, senão o Android não instala a atualização por cima).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux (Tauri + captura de tela)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libgbm-dev libegl1-mesa-dev \
            libxcb1-dev libx11-dev libwayland-dev clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Webtoon Translator ${{ github.ref_name }}"
          releaseBody: "Veja o README para instalar e configurar."
          releaseDraft: true
          prerelease: false

  # APK do Android, anexado ao mesmo rascunho criado pelo job do desktop.
  android:
    needs: build
    if: ${{ always() && needs.build.outputs.release_id != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: android/rust-bridge

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --version "^4" --locked

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gerar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Anexar ao release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const data = fs.readFileSync('android/app/build/outputs/apk/release/app-release.apk');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              name: `WebtoonTranslator-${context.ref.replace('refs/tags/', '')}.apk`,
              data,
              headers: { 'content-type': 'application/vnd.android.package-archive', 'content-length': data.length },
            });
