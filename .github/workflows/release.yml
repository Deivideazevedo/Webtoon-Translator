# Release: instaladores do desktop (Linux: AppImage/deb/rpm, Windows: exe/msi) e o APK do Android, num
# rascunho de Release só. Dispara ao enviar uma tag de versão:  git tag v0.2.0 && git push origin v0.2.0
# Dá pra gerar de novo à mão (Actions → Release → Run workflow, com a tag). O job "release" cria o rascunho
# (ou acha o que já existe) e os 3 builds rodam em paralelo, cada um anexando seus arquivos assim que termina.
# Push no main que muda dependência (Cargo/Gradle): os 3 só compilam (sem release), pra deixar o cache
# pronto. As tags reaproveitam o cache do main (as dependências compiladas) e só recompilam o nosso
# código; commit comum não roda nada no main, já que o cache de antes continua servindo.
# O APK é assinado com a chave dos secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD: sempre a mesma, senão o Android não instala a atualização por cima.
name: Release
# Nome de cada execução na aba Actions: o release de verdade ou só a compilação de cache do main,
# seguido do título do commit.
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release {0} · {1}', github.ref_name, github.event.head_commit.message)
  || github.event_name == 'workflow_dispatch' && format('Release {0} (gerado de novo)', inputs.tag)
  || format('Cache ({0}) · {1}', github.ref_name, github.event.head_commit.message) }}

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Só vale pro main (o GitHub não aplica filtro de arquivos a tags): roda quando as dependências mudam.
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "android/**/*.gradle.kts"
      - "android/gradle/libs.versions.toml"
      - "android/gradle/wrapper/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release a gerar de novo (ex.: v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# No main, um push novo cancela a compilação de cache anterior; tags nunca são canceladas.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = all.find((r) => r.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Webtoon Translator ${tag}`,
                body: "Veja o README para instalar e configurar.", draft: true,
              })).data;
            }
            core.setOutput("id", release.id);

  desktop:
    needs: release
    # Roda também quando o "release" é pulado (push no main, só cache).
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Dependências do Linux (Tauri + captura de tela)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libgbm-dev libegl1-mesa-dev \
            libxcb1-dev libx11-dev libwayland-dev clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop

      # Push no main: só compila, pra deixar o cache pronto pras tags.
      - name: Compilar (cache)
        if: needs.release.outputs.id == ''
        working-directory: src-tauri
        run: cargo build --release

      - uses: tauri-apps/tauri-action@v0
        if: needs.release.outputs.id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # CLI do Tauri já compilado (npm): compilar com "cargo install" levava 5–9 min por máquina.
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.release.outputs.id }}

  android:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Dependências do Gradle guardadas entre builds.
          cache: gradle

      # A máquina já tem o Android SDK; só aceita as licenças e instala o NDK que a ponte Rust usa.
      - name: Android SDK e NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;30.0.16248370" "build-tools;36.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: android/rust-bridge
          shared-key: android

      # cargo-ndk já compilado (compilar com "cargo install" levava ~1,5 min).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Chave de assinatura
        if: needs.release.outputs.id != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Gerar o APK
        working-directory: android
        env:
          # Sem release (push no main), compila sem assinar: só pra deixar o cache pronto.
          ANDROID_KEYSTORE_FILE: ${{ needs.release.outputs.id != '' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Anexar ao release
        if: needs.release.outputs.id != ''
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const name = `WebtoonTranslator-${process.env.TAG}.apk`;
            // Gerando de novo: troca o APK anterior.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            for (const asset of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            const data = fs.readFileSync("android/app/build/outputs/apk/release/app-release.apk");
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name, data,
              headers: { "content-type": "application/vnd.android.package-archive", "content-length": data.length },
            });
