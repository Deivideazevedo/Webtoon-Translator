[package]
name = "webtoon-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Núcleo compartilhado (desktop e Android): OCR, tradução com streaming, pronúncia e voz"

[features]
default = ["kokoro", "ocr"]
# Voz Kokoro via sherpa-onnx. No Android ela é um download opcional, então dá pra compilar sem.
kokoro = ["dep:sherpa-onnx"]
# OCR ocrs (desktop). O Android usa o OCR do Google (ML Kit) e só o agrupamento em balões daqui.
ocr = ["dep:ocrs", "dep:rten"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls em vez do OpenSSL do sistema: compila igual no Linux, Windows e Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
ocrs = { version = "0.14", optional = true }
rten = { version = "0.28", optional = true }
sherpa-onnx = { version = "2.0.2", default-features = false, features = ["static"], optional = true }
sha2 = "0.11.1"
tar = "0.4.46"
bzip2 = "0.6.1"
# Benchmark: chamadas em paralelo sem depender do runtime de cada app.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
image = "0.25"
